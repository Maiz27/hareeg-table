name: Feature request
description: Suggest a feature or improvement. No internal tracking number needed.
title: "🧩 "
labels: ["🧩 feature", "🧭 needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! This template is for anyone — you do **not** need to
        link a PRD or use an `HT-##` number. Maintainers handle that during triage.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the player need or pain point, not just the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: What should the game do? Describe the end-to-end experience.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, if any.
  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Mockups, references, or rule considerations.
