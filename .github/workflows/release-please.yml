name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Opt JS-based actions onto Node 24 now; GitHub is removing the Node 20 runtime
# they default to (deprecation forces Node 24 from 2026-09).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release and publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Check out release tag
        if: ${{ steps.release.outputs.release_created == 'true' }}
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ steps.release.outputs.tag_name }}
          persist-credentials: false

      - name: Set up Java
        if: ${{ steps.release.outputs.release_created == 'true' }}
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        if: ${{ steps.release.outputs.release_created == 'true' }}
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        if: ${{ steps.release.outputs.release_created == 'true' }}
        run: flutter pub get

      - name: Validate Android signing secrets
        if: ${{ steps.release.outputs.release_created == 'true' }}
        shell: bash
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          missing=0
          for name in \
            ANDROID_RELEASE_KEYSTORE_BASE64 \
            ANDROID_RELEASE_KEYSTORE_PASSWORD \
            ANDROID_RELEASE_KEY_ALIAS \
            ANDROID_RELEASE_KEY_PASSWORD
          do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required GitHub Actions secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Decode Android release keystore
        if: ${{ steps.release.outputs.release_created == 'true' }}
        shell: bash
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > android/app/release-keystore.jks

      - name: Build release APK
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/release-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: flutter build apk --release --build-name "${{ steps.release.outputs.version }}" --build-number "${{ github.run_number }}"

      - name: Prepare release asset
        if: ${{ steps.release.outputs.release_created == 'true' }}
        id: asset
        shell: bash
        run: |
          mkdir -p release
          apk="release/hareeg-table-${{ steps.release.outputs.tag_name }}-android.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$apk"
          echo "apk=$apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK to GitHub Release
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ steps.release.outputs.tag_name }}" "${{ steps.asset.outputs.apk }}" --clobber
