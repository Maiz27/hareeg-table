name: Deploy web to GitHub Pages

# Builds the Flutter web bundle and publishes it to GitHub Pages so the game can
# be tried in a browser with no install (see HT-63 / #107). Runs on every push
# to main, and can be triggered manually (e.g. from the HT-63 branch before the
# PR merges) via the Actions tab.
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Permissions required by the GitHub Pages deployment actions.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; cancel an in-flight run if a newer one
# starts.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Project Pages are served from a sub-path (https://<user>.github.io/
      # hareeg-table/), so the base href must match or assets 404. Hash routing
      # means deep refresh works without a server rewrite.
      - name: Build web
        run: flutter build web --release --base-href "/hareeg-table/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
