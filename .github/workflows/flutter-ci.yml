name: Flutter CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Nightly full-seed invariant sweep at 03:00 UTC. PRs run a reduced seed set
    # for fast feedback; this (and every push to main) runs the complete matrix.
    - cron: "0 3 * * *"

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        # `flutter test` defaults concurrency to numberOfProcessors ~/ 2 (so 2 on
        # a 4-vCPU runner), which leaves half the cores idle and serialises the
        # heavy invariant sweep. Pin it to the full vCPU count so the per-file
        # sweep suites actually spread across every core.
        #
        # HAREEG_FULL_SWEEP runs the complete invariant-sweep seed matrix on
        # push-to-main and the nightly schedule; pull requests leave it unset and
        # run a reduced seed set (all other axes preserved) for fast feedback.
        env:
          HAREEG_FULL_SWEEP: ${{ (github.event_name == 'push' || github.event_name == 'schedule') && '1' || '' }}
        run: flutter test --concurrency=$(nproc)
