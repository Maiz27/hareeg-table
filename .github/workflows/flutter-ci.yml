name: Flutter CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        # `flutter test` defaults concurrency to numberOfProcessors ~/ 2 (so 2 on
        # a 4-vCPU runner), which leaves half the cores idle and serialises the
        # heavy invariant sweep. Pin it to the full vCPU count so the per-file
        # sweep suites actually spread across every core.
        run: flutter test --concurrency=$(nproc)
